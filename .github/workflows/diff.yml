name: Schema diff

# Also run after changes are reverted, so an existing comment cannot show an obsolete comparison.
on:
  pull_request:

concurrency:
  group: resin-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
