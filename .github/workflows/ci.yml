name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Run the CLI on the examples
        run: |
          for f in examples/*.erd; do
            pnpm -s resin "$f" > /dev/null
            pnpm -s resin "$f" --svg > /dev/null
          done
