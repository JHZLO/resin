name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18.0", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build the site (every docs example must compile)
        run: pnpm build:site
      - name: Run the CLI on the examples
        run: |
          for f in examples/*.erd; do
            pnpm -s resin "$f" > /dev/null
            pnpm -s resin "$f" --model > /dev/null
          done

  browsers:
    name: Browser workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build:site
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failures
          path: test-results/
