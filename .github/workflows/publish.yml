name: Publish

# A version tag (v0.2.0) on main publishes that version to npm. There is no npm token anywhere: npm
# trusts this workflow file through OIDC (trusted publishing) and attaches provenance to the package.
# Only the publish job can mint that credential, so it runs no tests and no dependency install
# scripts, uses no cache, and every action is pinned to a commit.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag is on main and names the version in package.json
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Building needs TypeScript and nothing that installs code of its own
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish, unless this version is already on npm
        run: |
          npm --version # trusted publishing needs 11.5.1 or newer; Node 24 ships it
          version=$(node -p "require('./package.json').version")
          if npm view "@jhzlo/resin@$version" version >/dev/null 2>&1; then
            echo "@jhzlo/resin@$version is already published"
          else
            npm publish
          fi
