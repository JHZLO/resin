<style>
/* Layout: a slim top bar over two panes (source | diagram) split by a draggable divider; one column on
   phones. Controls that only affect the drawing float over the canvas. State is shown with neutral
   fills; the accent is kept for focus, the active tab and the focused row.
   The canvas is a WebGL stage (playground/glass.ts) painted under the SVG: the chosen background
   theme (aurora, silk or caustic), dark or light with the page. --stage matches the aurora base so
   the first paint does not flash. */
:root {
  --bg: #F3F4F6;
  --panel: #FFFFFF;
  --canvas: #F7F8FA;
  --ink: #181C21;
  --muted: #586271;
  --faint: #8A929E;
  --rule: #DDE1E6;
  --control: #FFFFFF;
  --control-on: #E6E9ED;
  --code: #EEF0F3;
  --accent: #9A5A0C;
  --accent-soft: rgba(205, 138, 30, 0.14);
  --active-line: rgba(24, 28, 33, 0.035);
  --selection: rgba(205, 138, 30, 0.22);
  --stage: #E9EBF1;
  --shadow: 0 1px 2px rgba(24, 28, 33, 0.08), 0 4px 12px rgba(24, 28, 33, 0.06);
  --syn-kw: #1D57A3;
  --syn-type: #0F6F74;
  --syn-str: #2C7437;
  --syn-num: #8A3FA0;
  --danger: #B42318;
  --warn: #9A6700;
  --k-pk: #B26A00;
  --k-uk: #6D4FD8;
  --k-fk: #0B7A90;
  --ok: #1A7F37;
  --scroll: rgba(24, 28, 33, 0.16);
  --scroll-hover: rgba(24, 28, 33, 0.3);
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1013;
    --panel: #15181C;
    --canvas: #101215;
    --ink: #E3E6EA;
    --muted: #97A1AD;
    --faint: #69727E;
    --rule: #272C33;
    --control: #1A1E23;
    --control-on: #2C323A;
    --code: #1B1F24;
    --accent: #E2A64D;
    --accent-soft: rgba(226, 166, 77, 0.14);
    --active-line: rgba(236, 237, 239, 0.035);
    --selection: rgba(226, 166, 77, 0.24);
    --stage: #05060C;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.3);
    --syn-kw: #86B4F2;
    --syn-type: #6FD0C9;
    --syn-str: #93CC92;
    --syn-num: #D6A2E8;
    --danger: #F97066;
    --warn: #E3B341;
    --k-pk: #F6C76B;
    --k-uk: #C8BBFF;
    --k-fk: #86E1EC;
    --ok: #3FB950;
    --scroll: rgba(236, 237, 239, 0.16);
    --scroll-hover: rgba(236, 237, 239, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1013;
  --panel: #15181C;
  --canvas: #101215;
  --ink: #E3E6EA;
  --muted: #97A1AD;
  --faint: #69727E;
  --rule: #272C33;
  --control: #1A1E23;
  --control-on: #2C323A;
  --code: #1B1F24;
  --accent: #E2A64D;
  --accent-soft: rgba(226, 166, 77, 0.14);
  --active-line: rgba(236, 237, 239, 0.035);
  --selection: rgba(226, 166, 77, 0.24);
  --stage: #05060C;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.3);
  --syn-kw: #86B4F2;
  --syn-type: #6FD0C9;
  --syn-str: #93CC92;
  --syn-num: #D6A2E8;
  --danger: #F97066;
  --warn: #E3B341;
  --k-pk: #F6C76B;
  --k-uk: #C8BBFF;
  --k-fk: #86E1EC;
  --ok: #3FB950;
  --scroll: rgba(236, 237, 239, 0.16);
  --scroll-hover: rgba(236, 237, 239, 0.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* `hidden` always wins over a component's own display */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  -webkit-font-smoothing: antialiased;
}
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.bar {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: env(safe-area-inset-top, 0px) 12px 0 16px;
  border-bottom: 1px solid var(--rule);
  background: var(--panel);
}
.brand { display: inline-flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; }
.brand svg { width: 20px; height: 20px; color: var(--accent); }
.brand-name { font-family: var(--font-mono); font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.brand-sub { color: var(--muted); font-size: 13px; }
.bar-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }

/* buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--control);
  color: var(--ink);
  font-size: 13px;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { background: var(--control-on); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--control-on); }
.btn.icon { width: 30px; justify-content: center; padding: 0; }
.btn svg { width: 16px; height: 16px; flex: none; }
#theme .i { display: none; }
#theme[data-mode="auto"] .i-auto, #theme[data-mode="light"] .i-light, #theme[data-mode="dark"] .i-dark { display: block; }

/* panes */
.work {
  --split: 42%;
  display: grid;
  grid-template-columns: minmax(0, var(--split)) 1px minmax(0, 1fr);
  min-height: 0;
}
.work.is-moving { transition: grid-template-columns 0.24s cubic-bezier(0.2, 0.8, 0.2, 1), grid-template-rows 0.24s cubic-bezier(0.2, 0.8, 0.2, 1); }
.work.is-folded { grid-template-columns: minmax(0, 0%) 0px minmax(0, 1fr); }
.pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; background: var(--panel); }
/* hidden once the fold has played, so nothing inside can take focus */
.pane-source { transition: visibility 0s linear 0s; }
.work.is-folded > .pane-source { visibility: hidden; transition-delay: 0.24s; }
.work.is-folded > .splitter { visibility: hidden; }
.pane-head {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 40px;
  padding: 0 8px 0 12px;
  border-bottom: 1px solid var(--rule);
  font-size: 13px;
  flex: none;
}

/* example picker: the file name in the editor header */
.picker { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; margin-left: -8px; border-radius: 6px; color: var(--ink); }
.picker:hover { background: var(--control-on); }
.picker svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
.picker select {
  appearance: none;
  -webkit-appearance: none;
  border: 0;
  background: transparent;
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 0 14px 0 0;
  cursor: pointer;
}
.picker select:focus-visible { outline: none; }
.picker:focus-within { outline: 2px solid var(--accent); outline-offset: 0; }
.picker .chev { position: absolute; right: 6px; width: 12px; height: 12px; pointer-events: none; }
.pane-head .head-actions .btn.icon { width: 28px; height: 28px; }
.editor { flex: 1; min-height: 0; overflow: hidden; }
.editor .cm-editor { height: 100%; }
.problems { list-style: none; margin: 0; padding: 4px 0; border-top: 1px solid var(--rule); background: var(--bg); max-height: 32%; overflow: auto; flex: none; }

/* status bar: whether the source compiles, and where the cursor is */
.status {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 30px;
  padding: 0 12px 0 10px;
  border-top: 1px solid var(--rule);
  font-size: 12px;
  color: var(--muted);
  flex: none;
}
.status-problems {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 22px;
  padding: 0 6px;
  border: 0;
  border-radius: 5px;
  background: none;
  font-size: 12px;
  color: var(--muted);
  cursor: default;
}
.status-problems::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.status-problems[data-state="error"] { color: var(--danger); font-weight: 600; cursor: pointer; }
.status-problems[data-state="error"]::before { background: var(--danger); }
.status-problems[data-state="warning"] { color: var(--warn); font-weight: 600; cursor: pointer; }
.status-problems[data-state="warning"]::before { background: var(--warn); }
.status-problems:not([data-state="ok"]):hover { background: var(--control-on); }
.status-pos { margin-left: auto; font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }

/* scrollbars: thin and quiet, darker on hover */
.editor .cm-scroller, .problems, #mermaid-out, .ins-body { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
:is(.editor .cm-scroller, .problems, #mermaid-out, .ins-body)::-webkit-scrollbar { width: 10px; height: 10px; }
:is(.editor .cm-scroller, .problems, #mermaid-out, .ins-body)::-webkit-scrollbar-thumb { background: var(--scroll); border: 3px solid transparent; border-radius: 10px; background-clip: padding-box; }
:is(.editor .cm-scroller, .problems, #mermaid-out, .ins-body)::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-hover); }
:is(.editor .cm-scroller, .problems, #mermaid-out, .ins-body)::-webkit-scrollbar-track,
:is(.editor .cm-scroller, .problems, #mermaid-out, .ins-body)::-webkit-scrollbar-corner { background: transparent; }
.problem {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr);
  gap: 2px 10px;
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  padding: 5px 12px;
  font-size: 12.5px;
}
.problem:hover { background: var(--active-line); }
.problem-where { font-family: var(--font-mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.problem.is-error .problem-where { color: var(--danger); }
.problem.is-warning .problem-where { color: var(--warn); }
.problem-hint { grid-column: 2; color: var(--muted); }
.splitter { background: var(--rule); cursor: col-resize; touch-action: none; position: relative; z-index: 6; transition: background-color 0.15s ease; }
.splitter::after { content: ""; position: absolute; inset: 0 -4px; }
.splitter:hover, .splitter:focus-visible { background: var(--accent); outline: none; }

/* diagram pane */
.tabs { display: inline-flex; gap: 4px; align-self: stretch; margin-left: -4px; }
.tabs button {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 0 8px;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  font-size: 13px;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.stats { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.head-actions { margin-left: auto; display: inline-flex; gap: 4px; }
.btn .chev { width: 12px; height: 12px; margin: 0 -2px 0 -1px; color: var(--muted); }

/* download menu: plain (any page) or one of the glass looks with its backdrop */
.menu-wrap { position: relative; display: inline-flex; }
.menu {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  z-index: 5;
  display: grid;
  gap: 2px;
  width: 252px;
  padding: 4px;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: var(--panel);
  box-shadow: var(--shadow);
}
.menu[hidden] { display: none; }

/* the side panel: everything about one table, opened from its name on the diagram. It stays until
   it is closed (the button or Esc); clicking elsewhere on the canvas does not close it */
.inspector {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 4;
  width: min(360px, 100%);
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border-left: 1px solid var(--rule);
  box-shadow: -16px 0 32px rgba(0, 0, 0, 0.14);
  animation: slide-in 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.inspector[hidden] { display: none; }
@keyframes slide-in { from { transform: translateX(28px); opacity: 0; } }
.ins-bar { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 14px; border-bottom: 1px solid var(--rule); flex: none; }
.ins-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
.ins-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.ins-bar .btn { margin-left: auto; flex: none; }
.ins-body { flex: 1; min-height: 0; overflow: auto; padding: 16px 16px 28px; user-select: text; }
.panel.has-inspector .float.zoom { right: calc(min(360px, 100%) + 12px); }
.d-head { display: grid; gap: 6px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.d-name { margin: 0; font-family: var(--font-mono); font-size: 18px; font-weight: 600; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.d-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.d-desc { margin: 0; font-size: 13px; color: var(--muted); }
.d-meta { margin: 0; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.d-section { padding-top: 16px; }
.d-section h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
.d-section ul { display: grid; gap: 1px; margin: 0; padding: 0; list-style: none; }
.d-col { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: baseline; gap: 2px 8px; padding: 5px 6px; border-radius: 6px; }
.d-col:hover { background: var(--active-line); }
.d-key { font-family: var(--font-mono); font-size: 10px; font-weight: 600; }
.k-pk { color: var(--k-pk); }
.k-uk { color: var(--k-uk); }
.k-fk { color: var(--k-fk); }
.d-col-name { justify-self: start; padding: 0; border: 0; background: none; font-family: var(--font-mono); font-size: 12.5px; text-align: left; overflow-wrap: anywhere; cursor: pointer; }
.d-col-name:hover { text-decoration: underline; text-underline-offset: 3px; }
.d-type { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.d-col-desc, .d-col-facts { grid-column: 2 / -1; font-size: 12px; color: var(--muted); }
.d-col-facts { display: flex; flex-wrap: wrap; gap: 4px; padding-top: 2px; }
.d-chip { display: inline-block; padding: 0 6px; border: 1px solid var(--rule); border-radius: 4px; background: var(--code); font-family: var(--font-mono); font-size: 10.5px; line-height: 18px; color: var(--muted); }
.d-rel, .d-con, .d-note { padding: 4px 6px; font-size: 12.5px; line-height: 1.6; }
.d-table code, .d-pop code { font-family: var(--font-mono); font-size: 12px; }
.d-rel-meta { display: block; font-size: 11.5px; color: var(--faint); }
.d-link { padding: 0; border: 0; background: none; font-family: var(--font-mono); font-size: 12px; color: var(--accent); text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; cursor: pointer; }
.d-link:hover { text-decoration-color: currentColor; }

/* the column popover: a small card under its row, with text that can be selected and copied */
.pop {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 5;
  width: max-content;
  max-width: min(320px, calc(100% - 16px));
  padding: 10px 12px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--panel);
  color: var(--ink);
  box-shadow: var(--shadow);
  font-size: 12.5px;
  line-height: 1.45;
  user-select: text;
}
.d-pop-head { display: flex; align-items: baseline; gap: 8px; }
.d-pop-name { font-family: var(--font-mono); font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.d-pop .d-desc { margin: 4px 0 0; }
.d-facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; margin: 8px 0 0; }
.d-facts dt { font-size: 11.5px; color: var(--faint); }
.d-facts dd { margin: 0; font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.menu button {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr);
  align-items: center;
  column-gap: 10px;
  width: 100%;
  padding: 6px 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  text-align: left;
}
.menu button:hover, .menu button:focus-visible { background: var(--control-on); outline: none; }
.menu-title { font-size: 13px; line-height: 1.35; }
.menu-sub { grid-column: 2; font-size: 12px; line-height: 1.35; color: var(--muted); }
.swatch { position: relative; grid-row: span 2; width: 30px; height: 22px; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--rule); }
.swatch::after { content: ""; position: absolute; left: 7px; top: 6px; width: 16px; height: 10px; border-radius: 3px; }
.swatch.graphite { background: repeating-conic-gradient(var(--control-on) 0 25%, var(--panel) 0 50%) 0 0 / 8px 8px; }
.swatch.graphite::after { border: 1.5px solid var(--ink); opacity: 0.7; }
/* theme swatches: what each background looks like, the same in either page theme */
.sw-aurora, .sw-aurora-dark { background: linear-gradient(180deg, #05060C 0%, #5A5FF0 45%, #22C7A9 75%, #05060C 100%); }
.sw-aurora-light { background: linear-gradient(180deg, #E9EBF1 0%, #A9B1F7 45%, #8FD8CC 75%, #E9EBF1 100%); }
.sw-silk, .sw-silk-dark { background: linear-gradient(135deg, #0A0708 0%, #5B2C7A 40%, #D9893A 75%, #F1B6C4 100%); }
.sw-silk-light { background: linear-gradient(135deg, #F2ECE6 0%, #C9B8EE 45%, #F2C28E 100%); }
.sw-caustic, .sw-caustic-dark { background: radial-gradient(circle at 35% 30%, #9FE7F2 0, transparent 35%), linear-gradient(160deg, #0E5E70, #031018); }
.sw-caustic-light { background: radial-gradient(circle at 35% 30%, #FFFFFF 0, transparent 40%), linear-gradient(160deg, #E4F1F4, #9FD6E0); }
.swatch[class*="-dark"]::after { background: rgba(15, 18, 28, 0.78); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45); }
.swatch[class*="-light"]::after { background: rgba(250, 251, 253, 0.86); box-shadow: inset 0 0 0 1px #FFFFFF, 0 1px 2px rgba(15, 23, 42, 0.14); }
.sw { width: 14px; height: 10px; border-radius: 2px; flex: none; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, 0.4); }
.panel { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.panel[hidden] { display: none; }
.viewport {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  background-color: var(--stage);
  color: var(--ink);
  cursor: grab;
  touch-action: none;
  user-select: none;
}
/* the still drawing's dot grid (without WebGL); the live canvas hides its own */
.viewport:not(.grid) .rz-grid { display: none; }
.viewport.is-stale .stage-glass { opacity: 0.35; }
.viewport.is-panning { cursor: grabbing; }
.content { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.content svg { display: block; }
.content svg .rz-t { cursor: pointer; }
.viewport.is-panning .content svg .rz-t { cursor: grabbing; }
/* rows and table names answer the pointer faintly, so they read as clickable; clicking does the rest */
.content svg .rz-hit { transition: fill-opacity 0.12s ease; }
.content svg :is(.rz-c, .rz-head):hover > .rz-hit { fill-opacity: 0.07; }
.viewport.is-panning .content svg .rz-hit { fill-opacity: 0; }
.viewport.is-stale .content { opacity: 0.35; }

/* floating controls over the canvas */
.float {
  position: absolute;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: color-mix(in srgb, var(--panel) 78%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: var(--shadow);
}
.float.view { left: 12px; top: 12px; }
.float.stages { left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.float.zoom { right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.float button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 28px;
  min-width: 28px;
  padding: 0 8px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--muted);
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
}
.float button:hover { background: var(--control-on); color: var(--ink); }
.float button svg { width: 15px; height: 15px; }
.float .sep { width: 1px; height: 18px; background: var(--rule); margin: 0 3px; }
.float button[aria-pressed="true"] { background: var(--control-on); color: var(--ink); }
.float .seg { display: inline-flex; gap: 2px; }
.float .seg button[aria-pressed="true"], .float .seg button[aria-pressed="true"]:hover { background: var(--ink); color: var(--panel); }
#zoom-level { min-width: 48px; }

/* switch inside a toggle button: neutral track, filled when on */
.switch {
  position: relative;
  width: 22px;
  height: 12px;
  border-radius: 999px;
  border: 1px solid var(--faint);
  flex: none;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.switch::after {
  content: "";
  position: absolute;
  top: 1px;
  left: 1px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--faint);
  transition: transform 0.15s ease, background-color 0.15s ease;
}
.float button[aria-pressed="true"] .switch { background: var(--ink); border-color: var(--ink); }
.float button[aria-pressed="true"] .switch::after { transform: translateX(10px); background: var(--panel); }

/* focus: keep what is connected, fade the rest. The live canvas fades the glass under a faded table;
   the still drawing fades its shadow (rz-s) with the card */
.content svg :is(.rz-t, .rz-r, .rz-s) { transition: opacity 0.15s ease; }
.content svg.is-focus :is(.rz-t, .rz-r, .rz-s):not(.is-on) { opacity: 0.14; }
.content svg .rz-c.is-on .rz-hit { fill: var(--accent); fill-opacity: 0.18; }

.notice {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  font-size: 12.5px;
  border-radius: 999px;
  padding: 5px 12px;
  white-space: nowrap;
}
.stale { top: 56px; background: var(--panel); border: 1px solid var(--danger); color: var(--danger); box-shadow: var(--shadow); }
.empty { top: 45%; color: var(--muted); }
.empty code, .code-actions code { font-family: var(--font-mono); font-size: 12px; background: var(--code); padding: 1px 5px; border-radius: 4px; }

/* mermaid tab */
.code-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 8px 8px 14px;
  border-bottom: 1px solid var(--rule);
  font-size: 13px;
  color: var(--muted);
}
.code-actions p { margin: 0; }
.code-actions .btn { margin-left: auto; }
#mermaid-out {
  flex: 1;
  margin: 0;
  overflow: auto;
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.6;
  background: var(--canvas);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  margin: 0;
  background: var(--ink);
  color: var(--panel);
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 13px;
  z-index: 10;
}

@media (max-width: 900px) {
  .work { grid-template-columns: minmax(0, 1fr); grid-template-rows: 44vh 1px minmax(340px, 1fr); }
  .work.is-folded { grid-template-columns: minmax(0, 1fr); grid-template-rows: 0vh 0px minmax(340px, 1fr); }
  .splitter { cursor: default; pointer-events: none; }
}
@media (max-width: 600px) {
  .brand-sub, .stats, #copy-svg, .bar-actions .link-docs, .link-source .link-label { display: none; }
  .link-source { width: 30px; justify-content: center; padding: 0; }
  .float.view button .label-long, .float.stages .label-long, .float.zoom .label-long { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .content svg :is(.rz-t, .rz-r, .rz-s), .switch, .switch::after { transition: none; }
}
</style>
</head>
