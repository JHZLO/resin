<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>resin playground</title>
<meta name="description" content="Write resin, a small language for entity-relationship diagrams, and watch the ERD as you type.">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='5' width='12' height='14' rx='2' fill='none' stroke='%239A5A0C' stroke-width='2.4'/%3E%3Crect x='18' y='13' width='12' height='14' rx='2' fill='none' stroke='%239A5A0C' stroke-width='2.4'/%3E%3Cpath d='M14 10h2.5a1.5 1.5 0 0 1 1.5 1.5V18' fill='none' stroke='%239A5A0C' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script>
  // Apply a saved theme before the first paint
  try {
    var saved = localStorage.getItem("resin.theme");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
<style>
/* Layout: a slim top bar over two panes (source | diagram) split by a draggable divider; one column on
   phones. Controls that only affect the drawing float over the canvas. State is shown with neutral
   fills; the accent is kept for focus, the active tab and the focused row.
   The diagram inherits `color` from the canvas, because resin's SVG draws everything in currentColor. */
:root {
  --bg: #F3F4F6;
  --panel: #FFFFFF;
  --canvas: #F7F8FA;
  --ink: #181C21;
  --muted: #586271;
  --faint: #8A929E;
  --rule: #DDE1E6;
  --control: #FFFFFF;
  --control-on: #E6E9ED;
  --code: #EEF0F3;
  --accent: #9A5A0C;
  --accent-soft: rgba(205, 138, 30, 0.14);
  --active-line: rgba(24, 28, 33, 0.035);
  --selection: rgba(205, 138, 30, 0.22);
  --grid-dot: rgba(24, 28, 33, 0.2);
  --shadow: 0 1px 2px rgba(24, 28, 33, 0.08), 0 4px 12px rgba(24, 28, 33, 0.06);
  --syn-kw: #1D57A3;
  --syn-type: #0F6F74;
  --syn-str: #2C7437;
  --syn-num: #8A3FA0;
  --danger: #B42318;
  --warn: #9A6700;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1013;
    --panel: #15181C;
    --canvas: #101215;
    --ink: #E3E6EA;
    --muted: #97A1AD;
    --faint: #69727E;
    --rule: #272C33;
    --control: #1A1E23;
    --control-on: #2C323A;
    --code: #1B1F24;
    --accent: #E2A64D;
    --accent-soft: rgba(226, 166, 77, 0.14);
    --active-line: rgba(236, 237, 239, 0.035);
    --selection: rgba(226, 166, 77, 0.24);
    --grid-dot: rgba(236, 237, 239, 0.17);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.3);
    --syn-kw: #86B4F2;
    --syn-type: #6FD0C9;
    --syn-str: #93CC92;
    --syn-num: #D6A2E8;
    --danger: #F97066;
    --warn: #E3B341;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1013;
  --panel: #15181C;
  --canvas: #101215;
  --ink: #E3E6EA;
  --muted: #97A1AD;
  --faint: #69727E;
  --rule: #272C33;
  --control: #1A1E23;
  --control-on: #2C323A;
  --code: #1B1F24;
  --accent: #E2A64D;
  --accent-soft: rgba(226, 166, 77, 0.14);
  --active-line: rgba(236, 237, 239, 0.035);
  --selection: rgba(226, 166, 77, 0.24);
  --grid-dot: rgba(236, 237, 239, 0.17);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.3);
  --syn-kw: #86B4F2;
  --syn-type: #6FD0C9;
  --syn-str: #93CC92;
  --syn-num: #D6A2E8;
  --danger: #F97066;
  --warn: #E3B341;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  -webkit-font-smoothing: antialiased;
}
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.bar {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: env(safe-area-inset-top, 0px) 12px 0 16px;
  border-bottom: 1px solid var(--rule);
  background: var(--panel);
}
.brand { display: inline-flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; }
.brand svg { width: 20px; height: 20px; color: var(--accent); }
.brand-name { font-family: var(--font-mono); font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.brand-sub { color: var(--muted); font-size: 13px; }
.bar-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }

/* buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--control);
  color: var(--ink);
  font-size: 13px;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { background: var(--control-on); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--control-on); }
.btn.icon { width: 30px; justify-content: center; padding: 0; }
.btn svg { width: 16px; height: 16px; flex: none; }
#theme .i { display: none; }
#theme[data-mode="auto"] .i-auto, #theme[data-mode="light"] .i-light, #theme[data-mode="dark"] .i-dark { display: block; }

/* panes */
.work {
  --split: 42%;
  display: grid;
  grid-template-columns: minmax(0, var(--split)) 1px minmax(0, 1fr);
  min-height: 0;
}
.pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); }
.pane-head {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 40px;
  padding: 0 8px 0 12px;
  border-bottom: 1px solid var(--rule);
  font-size: 13px;
  flex: none;
}

/* example picker: the file name in the editor header */
.picker { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; margin-left: -8px; border-radius: 6px; color: var(--ink); }
.picker:hover { background: var(--control-on); }
.picker svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
.picker select {
  appearance: none;
  -webkit-appearance: none;
  border: 0;
  background: transparent;
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 0 14px 0 0;
  cursor: pointer;
}
.picker select:focus-visible { outline: none; }
.picker:focus-within { outline: 2px solid var(--accent); outline-offset: 0; }
.picker .chev { position: absolute; right: 6px; width: 12px; height: 12px; pointer-events: none; }
.problems-count { margin-left: auto; font-size: 12px; color: var(--muted); }
.problems-count[data-state="error"] { color: var(--danger); font-weight: 600; }
.problems-count[data-state="warning"] { color: var(--warn); font-weight: 600; }
.editor { flex: 1; min-height: 0; overflow: hidden; }
.editor .cm-editor { height: 100%; }
.problems { list-style: none; margin: 0; padding: 4px 0; border-top: 1px solid var(--rule); max-height: 32%; overflow: auto; }
.problem {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr);
  gap: 2px 10px;
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  padding: 5px 12px;
  font-size: 12.5px;
}
.problem:hover { background: var(--active-line); }
.problem-where { font-family: var(--font-mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.problem.is-error .problem-where { color: var(--danger); }
.problem.is-warning .problem-where { color: var(--warn); }
.problem-hint { grid-column: 2; color: var(--muted); }
.splitter { background: var(--rule); cursor: col-resize; touch-action: none; position: relative; }
.splitter::after { content: ""; position: absolute; inset: 0 -4px; }
.splitter:hover, .splitter:focus-visible { background: var(--accent); outline: none; }

/* diagram pane */
.tabs { display: inline-flex; gap: 4px; align-self: stretch; margin-left: -4px; }
.tabs button {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 0 8px;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  font-size: 13px;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.stats { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.head-actions { margin-left: auto; display: inline-flex; gap: 4px; }
.panel { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.panel[hidden] { display: none; }
.viewport {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  background-color: var(--canvas);
  color: var(--ink);
  cursor: grab;
  touch-action: none;
  user-select: none;
}
.viewport.grid {
  background-image: radial-gradient(circle, var(--grid-dot) 1.1px, transparent 1.4px);
  background-size: 18px 18px;
}
.viewport.is-panning { cursor: grabbing; }
.content { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.content svg { display: block; }
.content svg .rz-t { cursor: pointer; }
.viewport.is-panning .content svg .rz-t { cursor: grabbing; }
.viewport.is-stale .content { opacity: 0.35; }

/* floating controls over the canvas */
.float {
  position: absolute;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: var(--shadow);
}
.float.view { left: 12px; top: 12px; }
.float.zoom { right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.float button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 28px;
  min-width: 28px;
  padding: 0 8px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--muted);
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
}
.float button:hover { background: var(--control-on); color: var(--ink); }
.float button svg { width: 15px; height: 15px; }
.float .sep { width: 1px; height: 18px; background: var(--rule); margin: 0 3px; }
.float button[aria-pressed="true"] { background: var(--control-on); color: var(--ink); }
#zoom-level { min-width: 48px; }

/* switch inside a toggle button: neutral track, filled when on */
.switch {
  position: relative;
  width: 22px;
  height: 12px;
  border-radius: 999px;
  border: 1px solid var(--faint);
  flex: none;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.switch::after {
  content: "";
  position: absolute;
  top: 1px;
  left: 1px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--faint);
  transition: transform 0.15s ease, background-color 0.15s ease;
}
.float button[aria-pressed="true"] .switch { background: var(--ink); border-color: var(--ink); }
.float button[aria-pressed="true"] .switch::after { transform: translateX(10px); background: var(--panel); }

/* focus: keep what is connected, fade the rest */
.content svg .rz-t, .content svg .rz-r { transition: opacity 0.15s ease; }
.content svg.is-focus .rz-t:not(.is-on), .content svg.is-focus .rz-r:not(.is-on) { opacity: 0.14; }
.content svg .rz-c.is-on .rz-hit { fill: var(--accent); fill-opacity: 0.18; }

.notice {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  font-size: 12.5px;
  border-radius: 999px;
  padding: 5px 12px;
  white-space: nowrap;
}
.stale { top: 56px; background: var(--panel); border: 1px solid var(--danger); color: var(--danger); box-shadow: var(--shadow); }
.empty { top: 45%; color: var(--muted); }
.empty code, .code-actions code { font-family: var(--font-mono); font-size: 12px; background: var(--code); padding: 1px 5px; border-radius: 4px; }

/* mermaid tab */
.code-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 8px 8px 14px;
  border-bottom: 1px solid var(--rule);
  font-size: 13px;
  color: var(--muted);
}
.code-actions p { margin: 0; }
.code-actions .btn { margin-left: auto; }
#mermaid-out {
  flex: 1;
  margin: 0;
  overflow: auto;
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.6;
  background: var(--canvas);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  margin: 0;
  background: var(--ink);
  color: var(--panel);
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 13px;
  z-index: 10;
}

@media (max-width: 900px) {
  .work { grid-template-columns: minmax(0, 1fr); grid-template-rows: 44vh 1px minmax(340px, 1fr); }
  .splitter { cursor: default; pointer-events: none; }
}
@media (max-width: 600px) {
  .brand-sub, .stats, #copy-svg, .bar-actions .link-docs { display: none; }
  .float.view button .label-long { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .content svg .rz-t, .content svg .rz-r, .switch, .switch::after { transition: none; }
}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="./" aria-label="resin playground">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="5" width="12" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2.4"/><rect x="18" y="13" width="12" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M14 10h2.5a1.5 1.5 0 0 1 1.5 1.5V18" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>
    <span class="brand-name">resin</span><span class="brand-sub">playground</span>
  </a>
  <div class="bar-actions">
    <button type="button" class="btn" id="share">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
      Copy link
    </button>
    <button type="button" class="btn ghost icon" id="theme" aria-label="Theme: auto" title="Theme: auto" data-mode="auto">
      <svg class="i i-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17Z" fill="currentColor" stroke="none"/></svg>
      <svg class="i i-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
      <svg class="i i-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
    </button>
    <a class="btn ghost link-docs" href="https://github.com/JHZLO/resin/blob/main/docs/SPEC.md" target="_blank" rel="noopener">Docs</a>
    <a class="btn ghost icon" href="https://github.com/JHZLO/resin" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg>
    </a>
  </div>
</header>

<main class="work" id="work">
  <section class="pane" aria-label="Source">
    <div class="pane-head">
      <label class="picker" title="Load an example">
        <span class="sr-only">Example</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></svg>
        <select id="example">
          <option value="order">orders.erd</option>
          <option value="shop">shop.erd</option>
          <option value="blank">blank.erd</option>
          <option value="" hidden>untitled.erd</option>
        </select>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </label>
      <span class="problems-count" id="problem-count">No problems</span>
    </div>
    <div class="editor" id="editor"></div>
    <ul class="problems" id="problems" hidden></ul>
  </section>
  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize the panes" tabindex="0"></div>
  <section class="pane" aria-label="Diagram">
    <div class="pane-head">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-diagram" aria-selected="true" aria-controls="panel-diagram">Diagram</button>
        <button type="button" role="tab" id="tab-mermaid" aria-selected="false" aria-controls="panel-mermaid">Mermaid</button>
      </div>
      <span class="stats" id="stats"></span>
      <span class="head-actions">
        <button type="button" class="btn ghost" id="copy-svg">Copy SVG</button>
        <button type="button" class="btn" id="download">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
          SVG
        </button>
      </span>
    </div>
    <div class="panel" id="panel-diagram" role="tabpanel" aria-labelledby="tab-diagram">
      <div class="viewport grid" id="viewport">
        <div class="content" id="content"></div>
        <p class="notice empty" id="empty" hidden>Add a <code>table</code> to see it here.</p>
        <p class="notice stale" id="stale" hidden>Showing the last valid diagram. Fix the errors to update it.</p>
        <div class="float view" role="group" aria-label="View">
          <button type="button" id="toggle-keys" aria-pressed="false" title="Show only key and reference columns"><span class="switch" aria-hidden="true"></span><span>Keys<span class="label-long"> only</span></span></button>
          <button type="button" id="toggle-audit" aria-pressed="false" title="Draw audit tables instead of folding them"><span class="switch" aria-hidden="true"></span><span>Audit<span class="label-long"> tables</span></span></button>
        </div>
        <div class="float zoom" role="group" aria-label="Zoom">
          <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
          <button type="button" id="zoom-level" title="Actual size">100%</button>
          <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
          <span class="sep" aria-hidden="true"></span>
          <button type="button" id="zoom-fit" title="Fit to screen (double-click the canvas)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg>Fit</button>
          <button type="button" id="grid-toggle" aria-pressed="true" title="Show grid"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/><circle cx="6" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg>Grid</button>
        </div>
      </div>
    </div>
    <div class="panel" id="panel-mermaid" role="tabpanel" aria-labelledby="tab-mermaid" hidden>
      <div class="code-actions"><p>Paste into any Mermaid renderer, such as a <code>```mermaid</code> block on GitHub.</p><button type="button" class="btn" id="copy-mermaid">Copy</button></div>
      <pre id="mermaid-out"></pre>
    </div>
  </section>
</main>
<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
